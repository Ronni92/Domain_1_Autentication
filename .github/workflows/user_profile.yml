name: Deploy User Profile Microservice

on:
  push:
    paths:
      - 'user_profile/**'
    branches:
      - main  # o la rama que estés usando

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/user-profile-service ./user_profile

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/user-profile-service

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST_USER_PROFILE }}
          username: ${{ secrets.EC2_USER_USER_PROFILE }}
          key: ${{ secrets.EC2_KEY_USER_PROFILE }}
          script: |
            sudo docker stop user-profile || true
            sudo docker rm user-profile || true
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/user-profile-service
            sudo docker run -d --name user-profile -p 3003:3003 ${{ secrets.DOCKER_USERNAME }}/user-profile-service
