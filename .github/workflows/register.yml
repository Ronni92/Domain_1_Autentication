name: Deploy Register Microservice

on:
  push:
    paths:
      - 'Register/**'
    branches:
      - Test

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/register-service ./Register

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/register-service

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST_REGISTER }}
          username: ${{ secrets.EC2_USER_REGISTER }}
          key: ${{ secrets.EC2_KEY_REGISTER }}
          script: |
            sudo docker stop register-service || true
            sudo docker rm register-service || true
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/register-service
            sudo docker run -d --name register-service -p 81:3000 ${{ secrets.DOCKER_USERNAME }}/register-service
