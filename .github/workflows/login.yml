deploy:
  needs: build-and-push
  runs-on: ubuntu-latest

  steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Copiar script a EC2
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST_LOGIN }}
        username: ${{ secrets.EC2_USER_LOGIN }}
        key: ${{ secrets.EC2_KEY_LOGIN }}
        source: "Login/deploy-login.sh"
        target: "~/deploy-login.sh"

    - name: SSH y ejecutar script como root
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST_LOGIN }}
        username: ${{ secrets.EC2_USER_LOGIN }}
        key: ${{ secrets.EC2_KEY_LOGIN }}
        script: |
          chmod +x ~/deploy-login.sh
          sudo bash ~/deploy-login.sh
