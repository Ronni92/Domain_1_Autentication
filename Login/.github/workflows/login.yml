name: Deploy Login Microservice

on:
  push:
    paths:
      - 'Login/**'
    branches:
      - Test

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/login-service ./Login

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/login-service

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
     - name: SSH and deploy container on EC2
     uses: appleboy/ssh-action@master
     with:
     host: ${{ secrets.EC2_HOST_LOGIN }}
     username: ${{ secrets.EC2_USER_LOGIN }}
     key: ${{ secrets.EC2_KEY_LOGIN }}
     script: |
   script: |
    sudo su -c "docker pull ${{ secrets.DOCKER_USERNAME }}/login-service"
    sudo su -c "docker stop login-service || true"
    sudo su -c "docker rm login-service || true"
    sudo su -c "docker run -d --name login-service -p 3000:3000 ${{ secrets.DOCKER_USERNAME }}/login-service"
